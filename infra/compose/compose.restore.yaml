name: cnc-wearpoint-restore

services:
  mysql-restore:
    image: mysql:8.4
    container_name: cnc-wearpoint-mysql-restore
    restart: "no"
    network_mode: "none"

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Required}
      MYSQL_DATABASE: ${DB_NAME:?Required}

    volumes:
      - restore_data:/var/lib/mysql
volumes:
  restore_data: {}