name: Sync to GitLab

# main 브랜치 또는 v* 형식의 Git tag가 push되면 실행
on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Sync branch or tag to GitLab
        run: |
          GITLAB_URL="https://oauth2:${{ secrets.GITLAB_SYNC_TOKEN }}@gitlab.com/cnc-wearpoint/cnc-wearpoint-backend.git"

          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            git push "$GITLAB_URL" "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          else
            git push "$GITLAB_URL" HEAD:main
          fi
