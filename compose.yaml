services:
  mysql:
    image: mysql:8.4
    container_name: cnc-wearpoint-mysql
    restart: unless-stopped # 자동재시작 (수동중지제외)

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Required}
      MYSQL_DATABASE: ${DB_NAME:?Required}
      MYSQL_USER: ${DB_USER:?Required}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Required}

    ports:
      - "127.0.0.1:3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: